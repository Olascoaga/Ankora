name: ankora-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Linux development specification; recreate the exact accepted environment
  # with linux-64.conda.lock and requirements/linux-py312.lock instead of solving.
  # Common scientific versions match the accepted Windows environment.
  - python=3.12.13
  - numpy=2.5.2
  - scipy=1.18.0
  - openmm=8.5.2
  - pdbfixer=1.12
  - pip=26.2.1
  - libblas=*=*openblas
