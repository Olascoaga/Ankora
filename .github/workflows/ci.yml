name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/windows-py312.lock
            requirements/windows-packaging.lock

      # The hosted interpreter carries unrelated tools (CI run 40808598327: pipx 1.18.4
      # requiring newer filelock/packaging than the locks), which made `pip check` fail.
      # Every later `python` resolves to this clean, project-only virtual environment.
      - name: Create isolated Python environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "ankora-ci-venv"
          & "${{ steps.setup-python.outputs.python-path }}" -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Join-Path $venv "Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify the isolated Python environment
        shell: python
        run: |
          import importlib.metadata
          import os
          import site
          import sys
          from pathlib import Path

          venv = Path(os.environ["VIRTUAL_ENV"]).resolve()
          if sys.prefix == sys.base_prefix or Path(sys.prefix).resolve() != venv:
              sys.exit(f"python on PATH is not the isolated environment: {sys.executable}")
          if site.ENABLE_USER_SITE:
              sys.exit("User site-packages must be disabled in the isolated environment.")
          distributions = list(importlib.metadata.distributions())
          outside = sorted(
              f"{dist.metadata['Name']} at {dist.locate_file('')}"
              for dist in distributions
              if not Path(str(dist.locate_file(""))).resolve().is_relative_to(venv)
          )
          if outside:
              sys.exit(f"Distributions outside the isolated environment are visible: {outside}")
          names = sorted(f"{dist.metadata['Name']}=={dist.version}" for dist in distributions)
          print(f"Isolated interpreter {sys.executable} (base {sys.base_prefix}); {names}")

      - name: Reject private absolute paths
        run: python scripts/check_public_paths.py

      - name: Verify public validation status
        run: python scripts/check_public_validation_status.py

      - name: Verify Windows environment locks
        run: python scripts/verify_windows_environment_lock.py

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      # Install exactly the accepted hash-locked wheels; never resolve version ranges.
      # One command per step: pwsh steps only fail on the last command's exit code.
      - name: Install hash-locked Python dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-py312.lock"

      - name: Install hash-locked packaging tools
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-packaging.lock"

      - name: Install backend source without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e backend

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify installed versions match the Windows locks
        shell: python
        run: |
          import importlib.metadata
          import platform
          import re
          import struct
          import sys
          from pathlib import Path

          if sys.version_info[:2] != (3, 12) or struct.calcsize("P") != 8:
              sys.exit(f"Locked cp312 wheels need 64-bit CPython 3.12, found {sys.version}")
          pip_version = importlib.metadata.version("pip")
          print(f"Python {platform.python_version()} {platform.machine()}; pip {pip_version}")
          pin = re.compile(r"^([A-Za-z0-9_.-]+)==(\S+)\s+--hash=sha256:[0-9a-f]{64}$")
          pins = {}
          for lock in ("requirements/windows-py312.lock", "requirements/windows-packaging.lock"):
              for line in Path(lock).read_text(encoding="utf-8").splitlines():
                  match = pin.match(line.strip())
                  if match:
                      name = re.sub(r"[-_.]+", "-", match.group(1)).lower()
                      pins[name] = match.group(2)
          # Version drift of these packages failed CI run 40803611622.
          required = {"dimorphite-dl": "2.0.2", "rdkit": "2025.9.6", "numpy": "2.5.2"}
          problems = [
              f"lock pins {name}=={pins.get(name)}, expected {version}"
              for name, version in required.items()
              if pins.get(name) != version
          ]
          for name, expected in sorted(pins.items()):
              try:
                  installed = importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:
                  installed = "missing"
              print(f"{name}=={installed}")
              if installed != expected:
                  problems.append(f"{name}: installed {installed}, locked {expected}")
          if problems:
              sys.exit("Installed environment differs from the Windows locks:\n  " + "\n  ".join(problems))
          print(f"{len(pins)} locked distributions are installed at their exact versions.")

      - name: Verify native-tool smoke matrix
        run: python scripts/run_native_tool_smoke.py --check

      - name: Run backend tests
        run: python -m pytest backend

      - name: Lint backend
        run: python -m ruff check backend

      - name: Type-check backend
        run: python -m mypy --config-file backend/pyproject.toml backend/src

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install production UI test browser
        run: npx playwright install chromium

      - name: Verify packaged frontend startup and molecular viewer CSP
        run: node scripts/smoke_packaged_frontend.mjs --receptor-recovery --receptor-guidance --receptor-wizard

      - name: Verify lossless pose interaction presentation
        run: node scripts/smoke_interaction_presentation.mjs

      - name: Verify development molecular viewer with a cold optimizer cache
        run: node scripts/smoke_interaction_presentation.mjs --development

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint native shell
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test native shell
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build native Tauri application
        run: npm run tauri:build

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ubuntu 24.04 native desktop and packaging packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            dpkg-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            zstd

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Create isolated Linux Conda environment
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/miniforge3.sh"
          miniforge_dir="$RUNNER_TEMP/miniforge3"
          conda_env="$RUNNER_TEMP/ankora-linux-ci"
          curl -fsSL --retry 3 \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh \
            -o "$installer"
          bash "$installer" -b -p "$miniforge_dir"
          rm -f "$installer"
          "$miniforge_dir/bin/conda" create \
            --prefix "$conda_env" \
            --file environment/linux-64.conda.lock \
            --yes
          echo "CONDA_PREFIX=$conda_env" >> "$GITHUB_ENV"
          echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
          echo "$conda_env/bin" >> "$GITHUB_PATH"

      - name: Verify the isolated Linux Conda environment
        shell: python
        run: |
          import importlib.metadata
          import os
          import site
          import sys
          from pathlib import Path

          prefix = Path(os.environ["CONDA_PREFIX"]).resolve()
          if Path(sys.prefix).resolve() != prefix or not (prefix / "conda-meta").is_dir():
              sys.exit(f"python on PATH is not the isolated Conda prefix: {sys.executable}")
          if sys.version_info[:3] != (3, 12, 13):
              sys.exit(f"Expected CPython 3.12.13 from lock, found {sys.version}")
          if site.ENABLE_USER_SITE:
              sys.exit("User site-packages must be disabled in the isolated Conda environment.")
          distributions = list(importlib.metadata.distributions())
          outside = sorted(
              f"{dist.metadata['Name']} at {dist.locate_file('')}"
              for dist in distributions
              if not Path(str(dist.locate_file(""))).resolve().is_relative_to(prefix)
          )
          if outside:
              sys.exit(f"Distributions outside the isolated Conda prefix are visible: {outside}")
          names = sorted(f"{dist.metadata['Name']}=={dist.version}" for dist in distributions)
          print(f"Isolated Conda interpreter {sys.executable}; {names}")

      - name: Reject private absolute paths
        run: python scripts/check_public_paths.py

      - name: Verify public validation status
        run: python scripts/check_public_validation_status.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install hash-locked Linux Python dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/linux-py312.lock"

      - name: Install backend source without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e backend

      - name: Check installed Linux dependency consistency
        run: python -m pip check

      - name: Verify Linux environment locks and active runtime
        run: python scripts/verify_linux_environment_lock.py --runtime

      # Verify packaging wheels in an isolated venv so build-only setuptools/pyinstaller
      # pins never overwrite the locked Conda runtime metadata verified above.
      - name: Verify isolated Linux packaging lock
        run: |
          set -euo pipefail
          pkg_venv="$RUNNER_TEMP/ankora-linux-packaging-venv"
          python -m venv "$pkg_venv"
          "$pkg_venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/linux-packaging.lock
          "$pkg_venv/bin/python" -m pip check

      # The 6 strict Windows-frozen BEDROC reproduction checks differ at <= 4 ULP on Linux
      # glibc libm (docs/validation/LINUX_PRIMARY_METRICS_NUMERIC_DIAGNOSTIC.md). Keep the
      # strict verifier untouched for Windows CI, run the SHA-256-anchored Linux diagnostic
      # gate explicitly, and deselect only those 6 documented historical Windows nodeids.
      - name: Run cross-platform primary metrics diagnostic
        run: python -m pytest backend/tests/test_screening_benchmark_primary_metrics_diagnostic.py

      - name: Run Linux backend tests
        run: >-
          python -m pytest backend
          --deselect tests/test_screening_benchmark_protocol.py::test_primary_vina_metrics_reproduce_from_the_closed_campaign
          --deselect tests/test_screening_benchmark_sensitivity_plan.py::test_sensitivity_plan_is_deterministic_and_loss_preserving
          --deselect tests/test_screening_benchmark_sensitivity_plan.py::test_sensitivity_plan_rejects_post_freeze_factor_tampering
          --deselect tests/test_screening_benchmark_sensitivity_plan.py::test_recorded_sensitivity_plan_reproduces_exactly
          --deselect "tests/test_screening_benchmark_sensitivity_plan.py::test_historical_verification_rejects_changed_source_bytes[microstate_schema_path]"
          --deselect "tests/test_screening_benchmark_sensitivity_plan.py::test_historical_verification_rejects_changed_source_bytes[microstate_service_path]"

      - name: Lint backend and Linux packaging scripts
        run: >-
          python -m ruff check backend
          scripts/linux_scientific_payload.py
          scripts/build_linux_backend.py
          scripts/build_linux_autodock_gpu.py
          scripts/stage_linux_scientific_payload.py
          scripts/complete_linux_legal.py
          scripts/build_linux_gnina_pack.py
          scripts/build_linux_installer.py
          scripts/smoke_linux_package.py
          scripts/verify_linux_environment_lock.py

      - name: Type-check backend
        run: python -m mypy --config-file backend/pyproject.toml backend/src

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint native Linux shell
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test native Linux shell
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build native Linux Tauri application
        run: npm run tauri:build:linux
