name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reject private absolute paths
        run: python scripts/check_public_paths.py

      - name: Verify Windows environment locks
        run: python scripts/verify_windows_environment_lock.py

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Verify native-tool smoke matrix
        run: python scripts/run_native_tool_smoke.py --check

      - name: Run backend tests
        run: python -m pytest backend

      - name: Lint backend
        run: python -m ruff check backend

      - name: Type-check backend
        run: python -m mypy --config-file backend/pyproject.toml backend/src

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint native shell
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test native shell
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build native Tauri application
        run: npm run tauri:build
